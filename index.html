cat > public/index.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 8 - Thai Consonant Drill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen */
        .start-screen h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .start-screen h2 {
            font-size: 24px;
            color: #667eea;
            margin-bottom: 30px;
        }

        .start-btn, .restart-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .start-btn:hover, .restart-btn:hover {
            background: #764ba2;
        }

        /* Drill Screen */
        .hearts {
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .drill-screen h2 {
            color: #333;
            margin-bottom: 30px;
        }

        .consonant {
            font-size: 80px;
            margin: 30px 0;
            font-weight: bold;
            color: #667eea;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 30px 0;
        }

        .option-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .progress {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }

        /* Result Screen */
        .result-screen h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .final-score {
            font-size: 48px;
            color: #667eea;
            margin: 30px 0;
            font-weight: bold;
        }

        .score-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div class="screen active" id="startScreen">
            <h1>Group 8 presents</h1>
            <h2>Thai Consonants</h2>
            <button class="start-btn" onclick="startGame()">Start Quiz</button>
        </div>

        <!-- Drill Screen -->
        <div class="screen" id="drillScreen">
            <div class="hearts" id="hearts"></div>
            <h2>Thai Consonant Drill</h2>
            <div class="consonant" id="consonant"></div>
            <div class="options" id="options"></div>
            <div class="progress" id="progress"></div>
        </div>

        <!-- Result Screen -->
        <div class="screen" id="resultScreen">
            <h2>Quiz Complete!</h2>
            <div class="final-score" id="finalScore"></div>
            <div class="score-text" id="scoreText"></div>
            <button class="restart-btn" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
EOF
